<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>网速测试 · Rust</title>
<style>
  :root{
    --bg:#0b1020;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --txt:#e8ecf8;
    --dim:#8b95b2;
    --dl:#4f8cff;
    --ul:#22c55e;
    --pg:#f5a524;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(79,140,255,.20), transparent 60%),
      radial-gradient(900px 520px at 92% 4%, rgba(34,197,94,.14), transparent 60%),
      var(--bg);
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:clamp(18px,4vw,48px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:960px;display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(22px,3.4vw,32px);letter-spacing:.5px;font-weight:700}
  h1 span{background:linear-gradient(90deg,var(--dl),var(--ul));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,16px)}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:clamp(16px,2.4vw,24px);
    backdrop-filter:blur(10px);
    position:relative;
    overflow:hidden;
    transition:border-color .25s, transform .25s;
  }
  .card.active{border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
  .card .label{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;letter-spacing:.4px}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.85}
  .val{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.05;margin-top:14px;font-size:clamp(34px,6.6vw,54px);letter-spacing:-1px}
  .val small{font-size:15px;font-weight:600;color:var(--dim);margin-left:6px;letter-spacing:0}
  .meta{color:var(--dim);font-size:12px;margin-top:8px;min-height:16px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
  .bar i{display:block;height:100%;width:0;transition:width .18s linear}
  #dlCard .dot{color:var(--dl)} #dlCard .bar i{background:linear-gradient(90deg,var(--dl),#8ab4ff)}
  #ulCard .dot{color:var(--ul)} #ulCard .bar i{background:linear-gradient(90deg,var(--ul),#6ee7a0)}
  #pgCard .dot{color:var(--pg)} #pgCard .bar i{background:linear-gradient(90deg,var(--pg),#ffd27a)}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  button{
    appearance:none;border:0;cursor:pointer;
    padding:16px 46px;border-radius:999px;
    font-size:17px;font-weight:700;color:#08101f;
    background:linear-gradient(135deg,#7fb2ff,#4f8cff 55%,#22c55e);
    box-shadow:0 10px 30px rgba(79,140,255,.35);
    transition:transform .15s, box-shadow .2s, opacity .2s;
    min-width:200px;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(79,140,255,.45)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .status{color:var(--dim);font-size:14px;min-height:20px;text-align:center}
  .status b{color:var(--txt);font-weight:600}
  .details{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;width:100%;
  }
  .kv{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kv .k{color:var(--dim);font-size:12px;margin-bottom:6px}
  .kv .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;word-break:break-all}
  footer{color:var(--dim);font-size:12px;text-align:center;padding-top:4px}
  a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>网速<span>测试</span></h1>
      <div class="sub">Rust + Axum · 本地多线程测速</div>
    </div>
    <div class="sub" id="serverInfo">你的 IP：<span id="serverIp">—</span></div>
  </header>

  <div class="grid">
    <div class="card" id="pgCard">
      <div class="label"><span class="dot"></span>延迟</div>
      <div class="val" id="pingVal">—<small>ms</small></div>
      <div class="meta" id="pingMeta">等待测试</div>
      <div class="bar"><i id="pgBar"></i></div>
    </div>
    <div class="card" id="dlCard">
      <div class="label"><span class="dot"></span>下载</div>
      <div class="val" id="dlVal">—<small>Mbps</small></div>
      <div class="meta" id="dlMeta">等待测试</div>
      <div class="bar"><i id="dlBar"></i></div>
    </div>
    <div class="card" id="ulCard">
      <div class="label"><span class="dot"></span>上传</div>
      <div class="val" id="ulVal">—<small>Mbps</small></div>
      <div class="meta" id="ulMeta">等待测试</div>
      <div class="bar"><i id="ulBar"></i></div>
    </div>
  </div>

  <div class="panel">
    <button id="startBtn">开始测速</button>
    <div class="status" id="status">点击开始，测试将进行 约 20 秒</div>
    <div class="details">
      <div class="kv"><div class="k">抖动 (Jitter)</div><div class="v" id="dJitter">—</div></div>
      <div class="kv"><div class="k">下载数据量</div><div class="v" id="dDlSize">—</div></div>
      <div class="kv"><div class="k">上传数据量</div><div class="v" id="dUlSize">—</div></div>
      <div class="kv"><div class="k">测试耗时</div><div class="v" id="dTime">—</div></div>
    </div>
  </div>

  <footer>speedtest-rs v1.0.0 · 端口 5111</footer>
</div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const DL_CONNS = 4;
  const UL_CONNS = 3;
  const PHASE_MS = 8000;

  const state = { running:false, dlBytes:0, ulBytes:0 };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const fmtB = (n) => {
    if (!n) return "0 B";
    const u = ["B","KB","MB","GB"];
    let i = 0, v = n;
    while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
    return v.toFixed(v >= 100 ? 0 : 1) + " " + u[i];
  };
  const setBar = (id, pct) => { $(id).style.width = Math.max(0, Math.min(100, pct)) + "%"; };
  const setCard = (id, on) => $(id).classList.toggle("active", on);

  async function loadServer(){
    try {
      const r = await fetch("/api/ip", { cache:"no-store" });
      $("serverIp").textContent = (await r.text()).trim() || "—";
    } catch (e) {
      $("serverIp").textContent = "—";
    }
  }

  async function phasePing(){
    setCard("pgCard", true);
    $("status").innerHTML = "正在测量 <b>延迟</b> …";
    const times = [];
    for (let i = 0; i < 12; i++){
      const t0 = performance.now();
      try {
        await fetch("/api/ping?r=" + Math.random(), { cache:"no-store" });
        times.push(performance.now() - t0);
      } catch (e) {}
      $("pingMeta").textContent = `采样 ${i+1}/12`;
      setBar("pgBar", (i+1)/12*100);
      await sleep(70);
    }
    setCard("pgCard", false);
    if (!times.length) return { avg:0, jitter:0 };
    times.sort((a,b)=>a-b);
    const trim = times.slice(1, Math.max(2, times.length-1));
    const avg = trim.reduce((a,b)=>a+b,0)/trim.length;
    let jit = 0;
    for (let i = 1; i < trim.length; i++) jit += Math.abs(trim[i]-trim[i-1]);
    jit = trim.length > 1 ? jit/(trim.length-1) : 0;
    $("pingVal").innerHTML = avg.toFixed(1) + "<small>ms</small>";
    $("pingMeta").textContent = `最低 ${times[0].toFixed(1)} ms · 抖动 ${jit.toFixed(1)} ms`;
    $("dJitter").textContent = jit.toFixed(1) + " ms";
    setBar("pgBar", 100);
    return { avg, jitter:jit };
  }

  async function phaseDownload(){
    setCard("dlCard", true);
    $("status").innerHTML = "正在测量 <b>下载</b> 速度（4 线程）…";
    state.dlBytes = 0;
    const started = performance.now();
    let stop = false;
    let lastT = started, lastB = 0;

    const ticker = setInterval(() => {
      const now = performance.now();
      const inst = (state.dlBytes - lastB) * 8 / ((now - lastT)/1000) / 1e6;
      lastT = now; lastB = state.dlBytes;
      const pct = Math.min(100, (now - started) / PHASE_MS * 100);
      $("dlMeta").textContent = `${inst.toFixed(0)} Mbps · 已接收 ${fmtB(state.dlBytes)}`;
      setBar("dlBar", pct);
    }, 200);

    const deadline = started + PHASE_MS;
    const workers = Array.from({length:DL_CONNS}, async () => {
      while (!stop && performance.now() < deadline) {
        const ctrl = new AbortController();
        const left = Math.max(200, deadline - performance.now());
        const kill = setTimeout(() => ctrl.abort(), left);
        try {
          const res = await fetch(`/api/download?bytes=${512*1024*1024}&r=${Math.random()}`, {
            cache:"no-store", signal: ctrl.signal
          });
          const reader = res.body.getReader();
          while (!stop) {
            const { done, value } = await reader.read();
            if (done) break;
            state.dlBytes += value.length;
          }
        } catch (e) {
          /* aborted / finished */
        } finally {
          clearTimeout(kill);
        }
        if (performance.now() < deadline) await sleep(0);
      }
    });

    await Promise.all(workers);
    stop = true;
    clearInterval(ticker);
    const secs = Math.max(0.2, (performance.now() - started)/1000);
    const mbps = state.dlBytes * 8 / secs / 1e6;
    $("dlVal").innerHTML = mbps.toFixed(mbps >= 100 ? 0 : 1) + "<small>Mbps</small>";
    $("dlMeta").textContent = `共接收 ${fmtB(state.dlBytes)} / ${secs.toFixed(1)} 秒`;
    $("dDlSize").textContent = fmtB(state.dlBytes);
    setBar("dlBar", 100);
    setCard("dlCard", false);
    return mbps;
  }

  function uploadOnce(blob, timeoutMs){
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      let sent = 0;
      const timer = setTimeout(() => { try { xhr.abort(); } catch (e) {} }, Math.max(200, timeoutMs));
      xhr.open("POST", "/api/upload?r=" + Math.random());
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.onprogress = (e) => {
        const delta = e.loaded - sent;
        if (delta > 0) state.ulBytes += delta;
        sent = e.loaded;
      };
      xhr.onloadend = () => { clearTimeout(timer); resolve(); };
      xhr.send(blob);
    });
  }

  async function phaseUpload(){
    setCard("ulCard", true);
    $("status").innerHTML = "正在测量 <b>上传</b> 速度（3 线程）…";
    state.ulBytes = 0;
    const started = performance.now();
    let lastT = started, lastB = 0;

    const ticker = setInterval(() => {
      const now = performance.now();
      const inst = (state.ulBytes - lastB) * 8 / ((now - lastT)/1000) / 1e6;
      lastT = now; lastB = state.ulBytes;
      const pct = Math.min(100, (now - started) / PHASE_MS * 100);
      $("ulMeta").textContent = `${inst.toFixed(0)} Mbps · 已发送 ${fmtB(state.ulBytes)}`;
      setBar("ulBar", pct);
    }, 200);

    const blob = new Blob([new Uint8Array(16*1024*1024)]);
    const deadline = started + PHASE_MS;
    await Promise.all(Array.from({length:UL_CONNS}, async () => {
      while (performance.now() < deadline) {
        await uploadOnce(blob, deadline - performance.now());
      }
    }));

    clearInterval(ticker);
    const secs = Math.max(0.2, (performance.now() - started)/1000);
    const mbps = state.ulBytes * 8 / secs / 1e6;
    $("ulVal").innerHTML = mbps.toFixed(mbps >= 100 ? 0 : 1) + "<small>Mbps</small>";
    $("ulMeta").textContent = `共发送 ${fmtB(state.ulBytes)} / ${secs.toFixed(1)} 秒`;
    $("dUlSize").textContent = fmtB(state.ulBytes);
    setBar("ulBar", 100);
    setCard("ulCard", false);
    return mbps;
  }

  async function run(){
    if (state.running) return;
    state.running = true;
    const btn = $("startBtn");
    btn.disabled = true; btn.textContent = "测速中…";
    const started = performance.now();
    ["pingVal","dlVal","ulVal"].forEach(id => $(id).innerHTML = "—" + (id === "pingVal" ? "<small>ms</small>" : "<small>Mbps</small>"));
    ["dJitter","dDlSize","dUlSize"].forEach(id => $(id).textContent = "—");
    ["pingMeta","dlMeta","ulMeta"].forEach(id => $(id).textContent = "准备中");
    ["pgBar","dlBar","ulBar"].forEach(id => setBar(id, 0));

    try {
      const ping = await phasePing();
      const dl = await phaseDownload();
      const ul = await phaseUpload();
      const secs = (performance.now() - started)/1000;
      $("dTime").textContent = secs.toFixed(1) + " 秒";
      $("status").innerHTML =
        `完成 · 延迟 <b>${ping.avg.toFixed(1)} ms</b> · 下载 <b>${dl.toFixed(1)} Mbps</b> · 上传 <b>${ul.toFixed(1)} Mbps</b>`;
    } catch (err) {
      $("status").textContent = "测试失败：" + (err && err.message ? err.message : err);
    } finally {
      state.running = false;
      btn.disabled = false; btn.textContent = "重新测速";
    }
  }

  $("startBtn").addEventListener("click", run);
  loadServer();
})();
</script>
</body>
</html>
